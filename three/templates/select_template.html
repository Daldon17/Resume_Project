{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Select Template</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
        }

        .page-title {
            font-weight: 700;
            color: #333;
        }

        .template-card {
            border: none;
            border-radius: 14px;
            overflow: hidden;
            transition: 0.3s ease;
            background: #fff;
        }

        .template-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .img-box {
            height: 260px;               
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fc;         
            padding: 10px;
        }

        
        .template-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .card-body h6 {
            font-weight: 600;
        }

        .btn-dark {
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <h2 class="text-center mb-5 page-title">Choose Resume Template</h2>

    <div class="row g-4 justify-content-center">

        {% for t in templates %}
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">

            <div class="card template-card shadow-sm h-100">

                <!-- FIXED HEIGHT BOX -->
                <div class="img-box">
                    <img src="{% static t.image %}" class="template-img" alt="template image">
                </div>

                <div class="card-body text-center">
                    <h6 class="mb-3">{{ t.name }}</h6>

                    <a href="{% url 'three:create_resume' t.file %}" class="btn btn-dark btn-sm w-100">
                        Use Template
                    </a>
                </div>

            </div>

        </div>
        {% endfor %}

    </div>
</div>

</body>
</html>
