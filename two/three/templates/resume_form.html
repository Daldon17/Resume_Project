<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Form</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
            min-height: 100vh;
        }

        .form-wrapper {
            max-width: 850px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .form-title {
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 12px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(13,110,253,.15);
        }

        textarea.form-control {
            min-height: 90px;
            resize: vertical;
        }

        .btn-dark {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="form-wrapper">

        <h3 class="form-title">Resume Builder</h3>

        <form method="POST" action="{% url 'three:preview_resume' %}">
            {% csrf_token %}

            <input type="hidden" name="template" value="{{ template }}">

            <div class="row">
                <div class="col-md-6 mb-2">
                    <input name="name" placeholder="Full Name" class="form-control">
                </div>
                <div class="col-md-6 mb-2">
                    <input name="email" placeholder="Email" class="form-control">
                </div>

                <div class="col-md-6 mb-2">
                    <input name="phone" placeholder="Phone" class="form-control">
                </div>
                <div class="col-md-6 mb-2">
                    <input name="linkedin" placeholder="LinkedIn" class="form-control">
                </div>

                <div class="col-md-6 mb-2">
                    <input name="languages" placeholder="Languages" class="form-control">
                </div>
                <div class="col-md-6 mb-2">
                    <input name="job_role" placeholder="Job Role" class="form-control">
                </div>

                <div class="col-12 mb-2">
                    <input name="address" placeholder="Address" class="form-control">
                </div>
            </div>

            <textarea name="objective" placeholder="Career Objective" class="form-control mb-2"></textarea>

            <textarea name="technical_skills" placeholder="Technical Skills" class="form-control mb-2"></textarea>
            <textarea name="soft_skills" placeholder="Soft Skills" class="form-control mb-2"></textarea>
            <textarea name="projects" placeholder="Projects" class="form-control mb-2"></textarea>
            <textarea name="internships" placeholder="Internships" class="form-control mb-2"></textarea>
            <textarea name="education" placeholder="Education" class="form-control mb-2"></textarea>

            <button class="btn btn-dark w-100 mt-3">Preview Resume</button>
        </form>

    </div>
</div>

</body>
</html>
